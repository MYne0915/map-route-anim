name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# ビルド結果を gh-pages ブランチへ push するだけなので、必要なのは contents: write。
# Pages のデプロイAPI(actions/deploy-pages)は使わない。
# このリポジトリではデプロイが deployment_queued のまま10分で
# 打ち切られる事象が頻発し、timeout を延ばしてもアクション側の
# 上限で効かなかったため、ブランチ方式に切り替えている。
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # vite.config.js は GITHUB_ACTIONS が立っているときだけ
      # base をリポジトリ名のサブパスにする
      - run: npm run build

      - name: gh-pages へ公開
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          # アンダースコア始まりのファイルがJekyllに無視されるのを防ぐ
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
